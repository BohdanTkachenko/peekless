[package]
name = "peekless"
version = "0.1.0"
edition = "2021"
description = "Hand secrets to an AI agent's command without the agent ever seeing them"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
gethostname = "0.5"
hkdf = "0.12"
humantime = "2"
libc = "0.2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
shell-words = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = true
strip = true
